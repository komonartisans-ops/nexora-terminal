name: actualizar

on:
  schedule:
    - cron: "7 6-22 * * 1-5"   # cada hora en días laborables (UTC): precios, FedWatch, tipos y evaluación de alertas → Telegram
    - cron: "30 21 * * 1-5"    # cierre de Nueva York (17:30 EDT / 16:30 EST): gamma de índices, semis/software, SKEW y alertas
    - cron: "30 5 * * *"       # diario 05:30 UTC: build completo (régimen, ciclo, datos publicados…)
    - cron: "0 8 * * 6"        # sábado: completo (COT y backtests ligeros llegan en fases posteriores)
  workflow_dispatch:
    inputs:
      modo:
        description: "horario | cierre | diario | todo"
        default: "diario"
      prueba_telegram:
        description: "Enviar una alerta de prueba a Telegram al terminar (true | false)"
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Dependencias (openpyxl: toneladas del ETF GLD y XLY/XLP; pypdf: comunicados del BoJ en PDF; ambas gratuitas)"
        run: pip install openpyxl pypdf
      - name: Elegir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ github.event.inputs.modo }}";
          elif [ "${{ github.event.schedule }}" = "7 6-22 * * 1-5" ]; then M="horario";
          elif [ "${{ github.event.schedule }}" = "0 8 * * 6" ]; then M="todo";
          elif [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ]; then M="cierre";
          else M="diario"; fi
          echo "modo=$M" >> "$GITHUB_OUTPUT"
      - name: Ejecutar build (cada fuente falla por separado, nunca la web entera)
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}   # opcional: activa la segunda fuente de PIB y PCE; sin el secreto queda SIN DATO
        run: python engine/build.py --modo "${{ steps.modo.outputs.modo }}"
      - name: Aviso previo por Telegram (eventos ALTA fuera de la franja del monitor, si caen en su ventana de 25-35 min)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/aviso_previo.py --push
      - name: Catch-up del monitor de reacciones (red de seguridad porque los crones de GitHub no están garantizados)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/reaccion.py --vivo
      - name: Salud de los workflows
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/salud.py
      - name: Alerta de prueba a Telegram (solo si se pide al lanzar a mano)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prueba_telegram == 'true' }}
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/alertas.py --prueba
      - name: Commit de data/ y site/data/ (memoria permanente; fusiona conflictos con el job de reacciones)
        run: python engine/push_seguro.py "datos ${{ steps.modo.outputs.modo }} $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
