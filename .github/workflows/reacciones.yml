name: reacciones

# Fase 8 · monitor de reacción a TODOS los eventos de importancia alta de la agenda oficial (IPC, PPI, NFP, PCE, PIB, FOMC, actas, ISM manufacturero). El job arranca ~60 min antes del evento (el cron de GitHub puede retrasarse)
# y ESPERA dentro del job, registrando T-5, T+5, T+15, T+30, T+60 y T+120 (el cierre y T+1 los recogen los crones de 16:05 y 10:05 ET). Cada cron cubre una de las dos horas UTC posibles
# (horario de verano / invierno de Nueva York); el script decide si hay evento hoy y es idempotente (no repite filas).
on:
  schedule:
    # GitHub NO garantiza los crones (el 15-oct no lanzó ninguno de los cuatro de las 11:30, 12:30, 14:05 y 17:00 UTC; en los últimos días solo ha
    # ejecutado una fracción de las horas programadas). Por eso hay muchos disparos redundantes y cada ejecución recoge TODO lo vencido (las barras
    # de 5 min de Yahoo permiten registrar fases pasadas con el mismo valor; solo cambia el origen a «vivo-tardío»). Si no hay nada pendiente, sale en segundos.
    - cron: "*/15 11-21 * * 1-5"   # 07:00-17:59 ET en verano: datos de las 08:30 y 10:00, FOMC 14:00, cierre 16:00 y T+1 a las 10:00
    - cron: "*/30 22-23,0-3 * * *" # noche: discursos del presidente de la Fed y fases tardías
  workflow_dispatch:
    inputs:
      modo:
        description: "vivo | reconstruir"
        default: "vivo"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: reacciones
  cancel-in-progress: false

jobs:
  reaccion:
    runs-on: ubuntu-24.04
    outputs:
      cambios: ${{ steps.push.outputs.cambios }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Aviso previo por Telegram (evento ALTA que empieza en 25-35 min; el monitor repite la comprobación mientras espera)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/aviso_previo.py --push
      - name: Vigilante de publicaciones (aviso si un dato oficial no está registrado 2 h después de publicarse)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/integridad.py vigilar --push
      - name: Registrar reacción
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.modo }}" = "reconstruir" ]; then python engine/reaccion.py --reconstruir --gracia 0; else python engine/reaccion.py --vivo; fi
      - name: Salud de los workflows (última ejecución y esperadas de hoy; aviso si actualizar lleva más de 2 h parado)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/salud.py
      - name: Commit (si el job se cancela por tiempo, igualmente se guarda lo registrado)
        id: push
        if: always()
        run: |
          OUT=$(python engine/push_seguro.py "reacciones $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]")
          echo "$OUT"
          if echo "$OUT" | grep -q "push ok"; then echo "cambios=true" >> "$GITHUB_OUTPUT"; else echo "cambios=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: reaccion
    if: ${{ always() && needs.reaccion.outputs.cambios == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
